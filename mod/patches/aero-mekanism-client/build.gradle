plugins {
    id 'java-library'
}

group = 'com.impulse.patches'
version = '1.0.1'

repositories { mavenCentral() }

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

def impulseJar = file('../../neoforge-1.21.1/build/libs/impulse-neoforge-1.21.1-1.3.1.jar')
if (!impulseJar.isFile()) throw new GradleException('Build the NeoForge 1.21.1 Impulse JAR before building this patch.')

dependencies {
    compileOnly files(impulseJar)
    compileOnly 'org.ow2.asm:asm-tree:9.7.1'
    testImplementation files(impulseJar)
    testImplementation 'org.ow2.asm:asm-tree:9.7.1'
    testImplementation 'org.ow2.asm:asm-util:9.7.1'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('jar') { archiveFileName = "aero-mekanism-client-${project.version}.patch.jar" }

def verifyPatch = tasks.register('verifyPatch', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.impulse.patches.aeromekanism.AeroMekanismClientPatchTest'
    if (project.hasProperty('originalCompatJar')) systemProperty 'patch.test.originalCompatJar', project.property('originalCompatJar')
    if (project.hasProperty('mekanismJar')) systemProperty 'patch.test.mekanismJar', project.property('mekanismJar')
}
tasks.named('check') { dependsOn verifyPatch }
