plugins {
    id 'java'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    implementation project(':common')
    implementation 'com.google.code.gson:gson:2.2.4'
    implementation 'com.github.webview:webview_java:1.3.0'
}

def webDirectory = file('web')
def webDist = file('web/dist')
def webGeneratedAssets = file('web/src/generated')
def impulseLogo = file('../../app/assets/icon-mono.png')

tasks.register('prepareWebAssets', Copy) {
    from impulseLogo
    into webGeneratedAssets
    rename { 'impulse-logo.png' }
    inputs.file impulseLogo
    outputs.file file('web/src/generated/impulse-logo.png')
}

tasks.register('installWebDependencies', Exec) {
    workingDir webDirectory
    inputs.files(file('web/package.json'), file('web/package-lock.json'))
    outputs.dir(file('web/node_modules'))
    commandLine 'npm', 'ci', '--no-audit', '--no-fund'
}

tasks.register('buildWeb', Exec) {
    dependsOn 'installWebDependencies', 'prepareWebAssets'
    workingDir webDirectory
    inputs.dir(file('web/src'))
    inputs.files(file('web/index.html'), file('web/package.json'), file('web/vite.config.ts'), file('web/tsconfig.json'))
    outputs.dir webDist
    commandLine 'npm', 'run', 'build'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar', Jar).configure {
    dependsOn 'buildWeb'
    archiveBaseName = 'impulse-standalone-ui'
    manifest {
        attributes 'Main-Class': 'com.impulse.standalone.ui.ImpulseStandaloneUi'
    }
    from(webDist) {
        into 'standalone-web'
    }
}
