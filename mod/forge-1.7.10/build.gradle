buildscript {
    repositories {
        mavenCentral()
        maven { name = 'forge'; url = 'https://maven.minecraftforge.net/' }
        maven { name = 'sonatype'; url = 'https://oss.sonatype.org/content/repositories/snapshots/' }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:1.2-SNAPSHOT'
    }
}

apply plugin: 'forge'

import net.minecraftforge.gradle.delayed.DelayedString

sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8
archivesBaseName = 'impulse-forge-1.7.10'

minecraft {
    version = '1.7.10-10.13.4.1614-1.7.10'
    runDir = 'run'
}

dependencies {
    compile project(':common')
}

jar {
    from project(':common').sourceSets.main.output
}

processResources {
    inputs.property 'version', project.version
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

afterEvaluate {
    tasks.downloadClient.url = new DelayedString(project, 'https://launcher.mojang.com/v1/objects/e80d9b3bf5085002218d4be59e668bac718abbc6/client.jar')
    tasks.downloadServer.url = new DelayedString(project, 'https://launcher.mojang.com/v1/objects/952438ac4e01b4d115c5fc38f891710c4941df29/server.jar')
    tasks.downloadClient.onlyIf {
        def clientJar = file("${gradle.gradleUserHomeDir}/caches/minecraft/net/minecraft/minecraft/1.7.10/minecraft-1.7.10.jar")
        !clientJar.exists() || clientJar.length() == 0
    }
    tasks.downloadServer.onlyIf {
        def serverJar = file("${gradle.gradleUserHomeDir}/caches/minecraft/net/minecraft/minecraft_server/1.7.10/minecraft_server-1.7.10.jar")
        !serverJar.exists() || serverJar.length() == 0
    }
}

gradle.taskGraph.whenReady {
    def clientJar = file("${gradle.gradleUserHomeDir}/caches/minecraft/net/minecraft/minecraft/1.7.10/minecraft-1.7.10.jar")
    def serverJar = file("${gradle.gradleUserHomeDir}/caches/minecraft/net/minecraft/minecraft_server/1.7.10/minecraft_server-1.7.10.jar")
    if (clientJar.exists() && clientJar.length() > 0) {
        tasks.downloadClient.actions = []
    }
    if (serverJar.exists() && serverJar.length() > 0) {
        tasks.downloadServer.actions = []
    }
}
